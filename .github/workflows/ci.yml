name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          shellcheck \
            tailscale-vnode/files/vnode.sh \
            tailscale-vnode/files/dns.sh \
            tailscale-vnode/files/tailscale-vnode.cli \
            tailscale-vnode/files/tailscale-vnode.init \
            tailscale-vnode/files/tailscaled-vnode \
            tailscale-vnode/files/tailscale-vnode.hotplug-dhcp \
            luci-app-tailscale-vnode/root/usr/libexec/rpcd/tailscale-vnode \
            tools/deploy.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript syntax
        run: find luci-app-tailscale-vnode/htdocs tools -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: JSON files
        run: find luci-app-tailscale-vnode/root -name '*.json' -print0 | xargs -0 -n1 node -e 'JSON.parse(require("fs").readFileSync(process.argv[1]))'

      - name: Translations up to date
        run: |
          node tools/update-po.js
          git diff --exit-code -- luci-app-tailscale-vnode/po

  # Builds both packages with an SDK the way the README says, with this
  # checkout as the feed.
  build:
    runs-on: ubuntu-latest
    env:
      SDK: immortalwrt-sdk-25.12.2-x86-64_gcc-14.3.0_musl.Linux-x86_64
      SDK_URL: https://downloads.immortalwrt.org/releases/25.12.2/targets/x86/64
      SDK_SHA256: 4d4631f134c2f27215a91aa7ef5bf9a01ea96c2450d3b8a5c38048c32462ac60
    steps:
      - uses: actions/checkout@v4

      - name: Build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential file gawk gettext git libncurses-dev \
            python3 python3-setuptools rsync unzip wget zstd

      - name: SDK
        run: |
          curl -fsSLO "$SDK_URL/$SDK.tar.zst"
          echo "$SDK_SHA256  $SDK.tar.zst" | sha256sum -c
          tar --zstd -xf "$SDK.tar.zst" -C "$RUNNER_TEMP"

      - name: Feeds
        working-directory: ${{ runner.temp }}/${{ env.SDK }}
        run: |
          cp feeds.conf.default feeds.conf
          echo "src-link tailscale_vnode $GITHUB_WORKSPACE" >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p tailscale_vnode
          make defconfig

      - name: Compile
        working-directory: ${{ runner.temp }}/${{ env.SDK }}
        run: |
          make package/tailscale-vnode/compile package/luci-app-tailscale-vnode/compile -j"$(nproc)" V=s
          find bin -name '*vnode*' -ls
          mkdir -p "$RUNNER_TEMP/packages"
          find bin -name '*vnode*.apk' -exec cp {} "$RUNNER_TEMP/packages/" \;
          # The service, the LuCI app and its Chinese translation.
          test "$(ls "$RUNNER_TEMP/packages" | wc -l)" -eq 3

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ${{ runner.temp }}/packages/

      # The package feed: both packages and an index signed with the key
      # whose public half is keys/tailscale-vnode.pem. Not for pull
      # requests, which get no secrets.
      - name: Signed feed
        if: github.event_name == 'push'
        working-directory: ${{ runner.temp }}/${{ env.SDK }}
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
        run: |
          [ -n "$APK_SIGN_KEY" ] || { echo "no APK_SIGN_KEY secret"; exit 1; }
          ( umask 077; printf '%s\n' "$APK_SIGN_KEY" > private-key.pem )
          openssl ec -in private-key.pem -pubout -out public-key.pem 2>/dev/null
          cmp public-key.pem "$GITHUB_WORKSPACE/keys/tailscale-vnode.pem"
          make package/index V=s
          rm -f private-key.pem
          dir=$(dirname "$(find bin/packages -path '*/tailscale_vnode/*.apk' | head -1)")
          ls -la "$dir"
          test -s "$dir/packages.adb"
          staging_dir/host/bin/apk adbdump "$dir/packages.adb" | grep -iE 'sign|key' | head -5 || true
          site="$RUNNER_TEMP/site"
          mkdir -p "$site/25.12"
          cp "$dir"/*.apk "$dir/packages.adb" "$site/25.12/"
          cp "$GITHUB_WORKSPACE/keys/tailscale-vnode.pem" "$site/key.pem"
          find "$site" -type f -ls

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: feed
          path: ${{ runner.temp }}/site/

  # A version tag (v0.1.0) publishes the packages as a release. The tag must
  # match PKG_VERSION in both Makefiles.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ lint, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          v=${GITHUB_REF_NAME#v}
          for mk in tailscale-vnode/Makefile luci-app-tailscale-vnode/Makefile; do
            grep -qx "PKG_VERSION:=$v" "$mk" || { echo "$mk does not say PKG_VERSION:=$v"; exit 1; }
          done

      - uses: actions/download-artifact@v4
        with:
          name: feed
          path: feed

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            feed/25.12/*.apk feed/key.pem
